<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubham Dansena · Resume</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0b0c0e;
    color: #f7f6f2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
  p.sub { color: #9aa0a8; font-size: 0.9rem; margin-bottom: 1.5rem; }
  a.btn {
    display: inline-block;
    background: #c8a96e;
    color: #0b0c0e;
    text-decoration: none;
    font-weight: 700;
    padding: 0.8rem 2rem;
    border-radius: 100px;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    transition: transform 0.2s ease;
  }
  a.btn:hover { transform: translateY(-2px); }
  .pdf-wrap {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 8.5 / 11;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #2a2d31;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .pdf-wrap embed {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <h1>Shubham Dansena</h1>
  <p class="sub">B.Tech CSE · VIT Vellore</p>
  <a href="resume.pdf" download class="btn">Download Resume ↓</a>
  <div class="pdf-wrap">
    <embed src="resume.pdf" type="application/pdf">
  </div>
</body>
</html>
