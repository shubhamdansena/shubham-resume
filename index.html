<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubham Dansena · Resume</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0b0c0e;
    color: #f7f6f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #16181b;
    border: 1px solid #2a2d31;
    border-radius: 20px;
    padding: 2.5rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  p { color: #9aa0a8; font-size: 0.9rem; margin-bottom: 1.8rem; }
  a.btn {
    display: inline-block;
    background: #c8a96e;
    color: #0b0c0e;
    text-decoration: none;
    font-weight: 700;
    padding: 0.8rem 2rem;
    border-radius: 100px;
    font-size: 0.9rem;
    transition: transform 0.2s ease;
  }
  a.btn:hover { transform: translateY(-2px); }
  embed {
    width: 100%;
    height: 500px;
    border-radius: 12px;
    margin-bottom: 1.5rem;
    border: 1px solid #2a2d31;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Shubham Dansena</h1>
    <p>B.Tech CSE · VIT Vellore</p>
    <embed src="resumee.pdf" type="application/pdf">
    <br>
    <a href="resume.pdf" download class="btn">Download Resume ↓</a>
  </div>
</body>
</html>
